{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0 fw-bold">🔑 Recuperar Contraseña</h4>
            </div>
            <div class="card-body p-4">
                {% if not paso_codigo %}
                <p class="text-muted small">Ingresa tu correo electrónico registrado. Si la cuenta existe, enviaremos un código de verificación temporal.</p>
                <form action="{{ url_for('portal.recuperar_password', slug=slug) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Correo Electrónico *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-portal w-100">Enviar Código de Recuperación</button>
                </form>
                {% else %}
                <form action="{{ url_for('portal.recuperar_password_confirmar', slug=slug) }}" method="POST">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Código de Verificación (6 dígitos) *</label>
                        <input type="text" name="codigo" class="form-control text-center fw-bold" maxlength="64" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nueva Contraseña * (mínimo 8 caracteres, letras y números)</label>
                        <input type="password" name="password_nueva" class="form-control" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">Restablecer Contraseña</button>
                </form>
                {% endif %}
                <div class="text-center mt-3 small">
                    <a href="{{ url_for('portal.login', slug=slug) }}">← Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
