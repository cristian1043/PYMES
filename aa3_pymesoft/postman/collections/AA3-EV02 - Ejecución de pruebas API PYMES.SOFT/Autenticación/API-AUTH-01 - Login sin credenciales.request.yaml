$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sin credenciales: HTTP 400', function () { pm.response.to.have.status(400); });
      pm.test('La respuesta es JSON', function () { pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'); });
      pm.test('La operación no se reporta como exitosa', function () { pm.expect(pm.response.json().exito).to.eql(false); });
    language: text/javascript
order: 1000
